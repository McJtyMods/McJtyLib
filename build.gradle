buildscript {
    repositories {
        maven { url = 'https://maven.firstdark.dev/releases' }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'com.hypherionmc.modutils:modpublisher:2.2.1'
    }
}

plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.fabricmc.fabric-loom' version '1.17.21'
}

apply plugin: 'com.hypherionmc.modutils.modpublisher'

// Use the workspace script for integrated and sibling checkout layouts.
def sharedTools = rootProject.file('gradletools.gradle')
if (rootProject != project && sharedTools.isFile()) {
    apply from: sharedTools
} else if (file('../Multi_fabric/gradletools.gradle').isFile()) {
    apply from: '../Multi_fabric/gradletools.gradle'
} else if (file('../gradletools.gradle').isFile()) {
    apply from: '../gradletools.gradle'
} else {
    apply from: 'https://raw.githubusercontent.com/McJtyMods/MultiWorkSpace/26.3_fabric/gradletools.gradle'
}

group = "com.github.mcjty"
base.archivesName = "mcjtylib-fabric"
java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

if (System.getenv('BUILD_NUMBER') != null) {
    version += ".${System.getenv('BUILD_NUMBER')}"
}

repos()
access()
runs()
jars()

dependencies {
    mc()
    config()
    energy()
    top()
    jei()
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.12.2'
}



task apiJar(type: Jar) {
    archiveClassifier = "api"
    from(sourceSets.main.output) {
        include "mcjty/lib/api/**"
    }
}

artifacts {
    archives apiJar
}

publishing {
    publications.create('mavenJava', MavenPublication) {
        from components.java
        artifact apiJar

        artifactId = base.archivesName.get()
        pom {
            name = 'McJtyLib'
            description = 'Base mod for all McJty tech mods'
            scm {
                url = 'https://github.com/McJtyMods/McJtyLib'
                connection = 'scm:git:git@github.com:McJtyMods/McJtyLib.git'
                developerConnection = 'scm:git:git@github.com:McJtyMods/McJtyLib.git'
            }
            issueManagement {
                system = 'github'
                url = 'https://github.com/McJtyMods/McJtyLib/issues'
            }
            licenses {
                license {
                    name = 'MIT'
                    distribution = 'repo'
                }
            }
            developers {
                developer {
                    id = 'McJty'
                    name = 'McJty'
                    roles = ['developer']
                }
            }
        }
    }
    repositories {
        if (System.getenv('local_maven') != null) {
            maven {
                name = 'local'
                url = 'file://' + System.getenv('local_maven')
            }
        }
    }
}


modpublisher(['the-one-probe'], ['fabric-api', 'forge-config-api-port'], ['the-one-probe'], ['fabric-api', 'forge-config-api-port'], [])



sourceSets.main.resources.srcDir 'src/generated/resources'

tasks.named('test') { useJUnitPlatform() }

// Convenient entry point for the checks that do not launch Minecraft.
tasks.register('portingRegression') { dependsOn tasks.named('test') }

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

// Opt-in native checks run in Fabric, where transfer API mixins are installed.
if (providers.gradleProperty('transferTests').isPresent()) {
    sourceSets {
        fabricTest {
            compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
            runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
        }
    }
    loom {
        mods {
            mcjtylib { sourceSet sourceSets.main }
            mcjtylib_transfer_test { sourceSet sourceSets.fabricTest }
        }
        runs {
            transferTest {
                server()
                source sourceSets.fabricTest
                runDir 'build/transfer-test'
            }
            datagenTest {
                server()
                source sourceSets.fabricTest
                vmArg '-Dfabric-api.datagen'
                vmArg '-Dfabric-api.datagen.modid=mcjtylib_transfer_test'
                vmArg '-Dfabric-api.datagen.output-dir=' + file('build/datagen-test-output').absolutePath
                runDir 'build/datagen-test'
            }
        }
    }
}

if (project.hasProperty('clientTests')) {
    if (!project.hasProperty('transferTests')) throw new GradleException('clientTests requires -PtransferTests')
    loom.runs.client {
        source sourceSets.fabricTest
        vmArg '-Dmcjtylib.clientRegression=true'
    }
}
