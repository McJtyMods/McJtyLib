buildscript {
    repositories {
        maven { url = 'https://maven.firstdark.dev/releases' }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'com.hypherionmc.modutils:modpublisher:2.2.1'
    }
}

plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.39'
}

apply plugin: 'com.hypherionmc.modutils.modpublisher'

// Use the same workspace script for integrated and standalone checkouts.
def sharedTools = rootProject == project
        ? [file('../Multi_neo/gradletools.gradle'), file('../gradletools.gradle')].find { it.isFile() }
        : rootProject.file('gradletools.gradle')
if (sharedTools != null && sharedTools.isFile()) {
    apply from: sharedTools
} else {
    apply from: 'https://raw.githubusercontent.com/McJtyMods/MultiWorkspace/26.3_neo/gradletools.gradle'
}

group = "com.github.mcjty"
base.archivesName = "mcjtylib"
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

if (System.getenv('BUILD_NUMBER') != null) {
    version += ".${System.getenv('BUILD_NUMBER')}"
}

sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    gametestImplementation.extendsFrom implementation
    gametestCompileOnly.extendsFrom compileOnly
    gametestRuntimeOnly.extendsFrom runtimeOnly
}

repos()
at()
runs()
// The shared script also defines a helper closure named 'runs'.
extensions.getByName('runs').named('gameTestServer') {
    modSource sourceSets.gametest
    argument '--test'
    argument 'mcjtylib:*'
}
jars()

dependencies {
    mc()
    top()
    jei()
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.12.2'
}



task apiJar(type: Jar) {
    archiveClassifier = "api"
    from(sourceSets.main.output) {
        include "mcjty/lib/api/**"
    }
}

artifacts {
    archives apiJar
}

publishing {
    publications.create('mavenJava', MavenPublication) {
        from components.java
        artifact apiJar

        artifactId = base.archivesName.get()
        pom {
            name = 'McJtyLib'
            description = 'Base mod for all McJty tech mods'
            scm {
                url = 'https://github.com/McJtyMods/McJtyLib'
                connection = 'scm:git:git@github.com:McJtyMods/McJtyLib.git'
                developerConnection = 'scm:git:git@github.com:McJtyMods/McJtyLib.git'
            }
            issueManagement {
                system = 'github'
                url = 'https://github.com/McJtyMods/McJtyLib/issues'
            }
            licenses {
                license {
                    name = 'MIT'
                    distribution = 'repo'
                }
            }
            developers {
                developer {
                    id = 'McJty'
                    name = 'McJty'
                    roles = ['developer']
                }
            }
        }
    }
    repositories {
        if (System.getenv('local_maven') != null) {
            maven {
                name = 'local'
                url = 'file://' + System.getenv('local_maven')
            }
        }
    }
}


modpublisher(['the-one-probe'], [], ['the-one-probe'], [], [])



sourceSets.main.resources.srcDir 'src/generated/resources'

tasks.named('test') { useJUnitPlatform() }

// Convenient entry point for the checks that do not launch Minecraft.
tasks.register('portingRegression') { dependsOn tasks.named('test') }
